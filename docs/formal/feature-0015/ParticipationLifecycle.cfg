SPECIFICATION Spec
\* Terminal participation phases deliberately have no further domain action.
\* Stuttering is permitted by Spec, so TLC deadlock detection is not meaningful.
CHECK_DEADLOCK FALSE
CONSTANTS
  Pending = "Pending"
  Active = "Active"
  Suspended = "Suspended"
  Rejected = "Rejected"
  Withdrawn = "Withdrawn"
  Expired = "Expired"
  Terminating = "Terminating"
  Terminated = "Terminated"
INVARIANTS
  TypeOK
  HoldDerivedState
  TerminalIsFinal
