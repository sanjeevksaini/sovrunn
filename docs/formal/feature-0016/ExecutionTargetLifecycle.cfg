SPECIFICATION Spec
\* Retired is terminal by design (no re-entry transition). Stuttering is
\* permitted by Spec, so TLC deadlock detection is not meaningful.
CHECK_DEADLOCK FALSE
CONSTANTS
  Active = "Active"
  Retired = "Retired"
  Unqualified = "Unqualified"
  Qualified = "Qualified"
  Rejected = "Rejected"
  Indeterminate = "Indeterminate"
  Available = "Available"
  Unavailable = "Unavailable"
  Maintenance = "Maintenance"
INVARIANTS
  TypeOK
  AvailabilityTruthTable
  MaintenanceRetireOutrankExpiry
  QualifyingNeverPersisted
  RetiredIsTerminal
