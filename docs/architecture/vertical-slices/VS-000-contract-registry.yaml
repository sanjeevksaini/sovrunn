    required: ["metadata.name:string(1..253)", "spec.cloudPlatformRef:TypedRef<CloudPlatform>(uid-pinned)", "spec.cloudProviderRef:TypedRef<CloudProvider>(uid-pinned)", "spec.environment:enum[development]", "status.phase:enum[Pending,Active,Rejected,Withdrawn,Expired,Suspended,Terminating,Terminated]", "status.platformSuspended:boolean", "status.providerSuspended:boolean"]
    optional: ["spec.providerSelectionModes:enum[CustomerSelected,PlatformAssigned][]", "spec.permittedHostingLocationRefs:TypedRef<HostingLocation>[]", "status.requestExpiresAt:RFC3339", "status.conditions:Condition[]"]
