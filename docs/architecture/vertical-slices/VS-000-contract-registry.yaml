stateMachines:
  - {id: VS0-STATE-001, kind: CloudProviderParticipation, initial: Pending, states: [Pending, Active, Rejected, Withdrawn, Expired, Suspended, Terminating, Terminated], transitions: ["Pending->Active:CloudPlatform administrator accept action", "Pending->Rejected:CloudPlatform administrator reject action", "Pending->Withdrawn:CloudProvider administrator withdraw action", "Pending->Expired:deterministic scheduler at requestExpiresAt", "Active->Suspended:either administrator sets only its own hold true", "Suspended->Suspended:the other administrator sets its own hold true", "Suspended->Active:both holds false after the acting administrator clears only its own hold", "Active|Suspended->Terminating:CloudPlatform administrator request-release action (holds retained)", "Terminating->Terminated:CloudProvider administrator accept-release action", "Terminating->Active:CloudProvider administrator decline-release action when both holds false", "Terminating->Suspended:CloudProvider administrator decline-release action when either hold true"], terminal: [Rejected, Withdrawn, Expired, Terminated], invalid: {code: CONFLICT, violation: VS0_PARTICIPATION_STATE_INVALID}, holdRule: "platformSuspended is set/cleared only by the CloudPlatform administrator; providerSuspended is set/cleared only by the CloudProvider administrator; effective Active requires both false; effective Suspended requires either true; clearing one hold never reactivates while the other remains true; suspend/resume denied while phase is Pending, Terminating, Rejected, Withdrawn, Expired, or Terminated"}
  - {id: VS0-STATE-002, kind: CloudEnrollment, initial: Pending, states: [Pending, Active, Suspended, Terminating, Terminated], transitions: ["Pending->Active:platform and organization refs valid", "Active->Suspended:governed suspension", "Suspended->Active:suspension cleared", "Active|Suspended->Terminating:termination approved", "Terminating->Terminated:no new consumption and retained summary written"], terminal: [Terminated], invalid: {code: CONFLICT, violation: VS0_ENROLLMENT_STATE_INVALID}}
  - {id: VS0-STATE-003, kind: VersionedDefinition, initial: Draft, states: [Draft, Published, Retired], transitions: ["Draft->Published:schema and references valid", "Published->Retired:retirement approved"], terminal: [Retired], immutableAfter: Published, invalid: {code: CONFLICT, violation: VS0_PLAN_NOT_PUBLISHED}}
  - id: VS0-STATE-004
    kind: ExecutionTarget
    initial: "Active/Unqualified"
    states: ["Active/Unqualified", "Active/Qualified", "Active/Rejected", "Active/Indeterminate", "Retired/Unqualified"]
    lifecycleAxis: [Active, Retired]
    qualificationAxis: [Unqualified, Qualified, Rejected, Indeterminate]
    inFlightReservation: "Qualifying is a lifecycle-service-only in-flight reservation over an Active/{Unqualified,Qualified,Rejected,Indeterminate} state; it is never a projected resource status and never a separate row in this state table (ADH-2026-058 clause 7/F16-AD-15)"
    transitions:
      - "Active/Unqualified|Active/Qualified|Active/Rejected|Active/Indeterminate->Active/Qualified:qualify completes with Supported facts (atomically replaces FactSet/Result, refreshes observedGeneration, new ETag, required AuditEvent)"
      - "Active/Unqualified|Active/Qualified|Active/Rejected|Active/Indeterminate->Active/Rejected:qualify completes with any Unsupported fact"
      - "Active/Unqualified|Active/Qualified|Active/Rejected|Active/Indeterminate->Active/Indeterminate:qualify completes with any Unknown fact and no Unsupported fact"
      - "Active/Unqualified|Active/Qualified|Active/Rejected|Active/Indeterminate->Active/Unqualified:maintenance enter (aborts any in-flight Qualifying reservation, clears current FactSet/Result links, increments maintenance epoch and resourceVersion) or maintenance clear (clears links, increments maintenance epoch and resourceVersion, projects Unavailable)"
      - "Active/Unqualified|Active/Qualified|Active/Rejected|Active/Indeterminate->Retired/Unqualified:retire (allowed from every Active combination including while Qualifying is in flight; clears current FactSet/Result links, releases the participation/stack/targetClass tuple, increments resourceVersion)"
    terminal: [Retired/Unqualified]
    effectiveAvailabilityProjection: "response-only, not persisted; ordered Retired->Unavailable; otherwise Active-with-current-Maintenance-marker->Maintenance; otherwise Active/Qualified-with-fresh-current-facts-and-viable-backing->Available; every other Active combination->Unavailable; a viability-only change never mutates the target or its ETag (ADH-2026-058 clause 7/F16-AD-15.2/15.3)"
    maintenanceMarker: "target-bound, in-process, lifecycle-service-owned current-Maintenance marker (target UID, maintenance epoch, active flag); never client-writable or projected; cleared on restart; entry establishes it, clear requires its matching current epoch (ADH-2026-058 clause 7)"
    invalid: {code: STALE_RESOURCE_VERSION, violation: VS0_TARGET_EPOCH_STALE}
    additionalInvalid:
      - {code: CONFLICT, violation: VS0_TARGET_RETIRED, meaning: "action attempted against a Retired target, or Retire wins during an in-flight qualification"}
      - {code: CONFLICT, violation: VS0_TARGET_MAINTENANCE, meaning: "qualify attempted against a target with an active current-Maintenance marker, or Maintenance entry wins during an in-flight qualification; evaluated before the epoch-stale predicate at qualification commit (ADH-2026-060)"}
      - {code: CONFLICT, violation: VS0_TARGET_QUALIFICATION_IN_PROGRESS, meaning: "different-key qualify attempted while a Qualifying reservation is in flight"}
      - {code: STALE_RESOURCE_VERSION, violation: VS0_EXECUTION_TARGET_VIABILITY_STALE, meaning: "viability fingerprint changed at qualification commit"}
  - {id: VS0-STATE-005, kind: QuotaReservation, initial: None, states: [None, Reserved, Committed, Released], transitions: ["None->Reserved:entitled and available capacity and unique idempotency key", "Reserved->Committed:Operation accepted", "Reserved->Released:pre-operation failure", "Committed->Released:delete terminal"], terminal: [Released], invalid: {code: CONFLICT, violation: VS0_QUOTA_EXHAUSTED}}
  - {id: VS0-STATE-006, kind: ServiceInstance, initial: Pending, states: [Pending, Provisioning, Ready, Failed, Deleting, Deleted], transitions: ["Pending->Provisioning:governance+requirements+decisions+plan pinned and Operation accepted", "Provisioning->Ready:Operation succeeded and verification succeeded", "Provisioning->Failed:Operation or verification failed", "Pending|Provisioning|Ready|Failed->Deleting:delete authorized", "Deleting->Deleted:bindings revoked, fake cleanup terminal, quota released"], terminal: [Deleted], invalid: {code: CONFLICT, violation: VS0_SERVICE_STATE_INVALID}}
  - {id: VS0-STATE-007, kind: ServiceBinding, initial: Pending, states: [Pending, Bound, Revoking, Revoked, Failed], transitions: ["Pending->Bound:instance Ready, consumer authorized, SecretRef identifier issued", "Pending->Failed:issuance failed with no SecretRef", "Bound->Revoking:revoke or instance delete accepted", "Revoking->Revoked:access revoked and secret reference invalidated", "Failed->Revoked:cleanup confirmed"], terminal: [Revoked], invalid: {code: CONFLICT, violation: VS0_BINDING_NOT_READY}}
  - {id: VS0-STATE-008, kind: Operation, initial: Pending, states: [Pending, Running, Succeeded, Failed, Cancelled], transitions: ["Pending->Running:accepted immutable plan and current generations/epochs", "Pending->Cancelled:cancel before execution", "Running->Succeeded:all required steps succeeded", "Running->Failed:step failed and compensation recorded", "Running->Cancelled:safe cancellation point"], terminal: [Succeeded, Failed, Cancelled], invalid: {code: CONFLICT, violation: VS0_GENERATION_STALE}}
  - {id: VS0-STATE-009, kind: PluginExecution, initial: Pending, states: [Pending, Running, Succeeded, Failed], transitions: ["Pending->Running:matching Operation/plan/step and fake executor", "Running->Succeeded:normalized result valid", "Running->Failed:normalized failure persisted"], terminal: [Succeeded, Failed], invalid: {code: CONFLICT, violation: VS0_PLUGIN_FAILURE}}
  - {id: VS0-STATE-010, kind: ImmutableSlice0Records, states: [FINAL], initial: FINAL, terminal: [FINAL], appendOnly: true, kinds: [DecisionRecord, AuditEvent, EvidenceRecord, EffectiveGovernanceContext, ServiceRequirementSet, ServiceDeploymentPlan, ServicePlacement], correction: "new linked immutable record only"}

