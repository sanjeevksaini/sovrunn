metadata:
  id: VS-000-CONTRACT-1
  version: 0.1.0
  status: Experimental
  scope: Slice0Only
  baseline: ARCH-2026.08-PHASE2R-CANONICAL
  controllingHandoff: ADH-2026-042
  semanticAuthorities:
    - docs/architecture/canonical/sovrunn-finalized-data-model.md
    - docs/architecture/canonical/sovrunn-final-canonical-contract-catalog.md
    - docs/architecture/vertical-slices/VS-000-core-skeleton.md
  proseSpec: docs/architecture/vertical-slices/VS-000-contract-specification.md
  traceability: docs/traceability/VS-000_CONTRACT_TRACEABILITY_MATRIX.md
  scopeKinds: [Platform, Organization, OrganizationUnit, Tenant, Project, CloudPlatform, CloudProvider]
  milestonesAreStates: false

schemaDefaults:
  metadata: "FEATURE-0012 ObjectMeta; name 1..253; uid/resourceVersion/timestamps/generation system-owned; exactly one canonical scopeRef except Platform"
  typedRef: "FEATURE-0012 TypedRef; apiVersion/kind/name required; uid required after resolution; name+uid must resolve to one object"
  managedResource: "metadata/spec/status; spec desired state; status system-owned; unknown and duplicate fields rejected"
  versionedDefinition: "draft mutable; published version immutable; changed contract creates a new version"
  immutableRecord: "FINAL on persistence; append-only; correction/supersession/revocation creates a linked record"
  limits: {string: 253, idempotencyKey: 128, reasonCode: 63, refs: 64, conditions: 32, violations: 32}
  classification: Tenant-confidential
  redaction: "customer projections omit Internal, Provider-confidential, Secret and protected-handle values"

