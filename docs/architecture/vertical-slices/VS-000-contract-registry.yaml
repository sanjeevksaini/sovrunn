  - id: VS0-SCHEMA-015
    identity: execution.sovrunn.io/v1alpha1/ExecutionTarget
    owner: FEATURE-0016
    profile: ManagedResource
    boundary: internal-engine-facing
    scopes: [CloudProvider]
    required: ["metadata.name:string(1..253)", "spec.cloudProviderParticipationRef:TypedRef<CloudProviderParticipation>(uid-pinned,immutable)", "spec.infrastructureStackRef:TypedRef<InfrastructureStack>(uid-pinned,immutable)", "spec.targetClass:const[synthetic-iaas](immutable)", "status.lifecycle:enum[Active,Retired]", "status.qualification:enum[Unqualified,Qualified,Rejected,Indeterminate]", "status.maintenanceEpoch:integer(min0)", "status.observedGeneration:integer(min1)"]
    optional: ["status.factSetRef:TypedRef<NormalizedTargetFactSet>", "status.qualificationResultRef:TypedRef<TargetQualificationResult>"]
    refs: {spec.cloudProviderParticipationRef: [CloudProviderParticipation], spec.infrastructureStackRef: [InfrastructureStack], status.factSetRef: [NormalizedTargetFactSet], status.qualificationResultRef: [TargetQualificationResult]}
    classification: Provider-confidential
    redaction: "never customer-visible; safe operator projection is exactly metadata.uid/name/generation/resourceVersion, the three immutable spec fields, status.lifecycle, status.qualification, and response-only effectiveAvailability; no public conditions member; facts/results/observer identity/handles/internal record links omitted (ADH-2026-058 clause 4/F16-AD-04/06.3)"
    mutability: "server-assigned identity/metadata; ExecutionTargetLifecycleService is the sole committer of status.lifecycle, status.qualification, status.maintenanceEpoch, status.observedGeneration, status.factSetRef, status.qualificationResultRef; clients never write status; no separate scopeRef persisted or projected — scope is always derived from spec.cloudProviderParticipationRef; no status.availability field exists; effectiveAvailability (Available/Unavailable/Maintenance) is a response-only projection computed by the lifecycle service, has no independently persisted writer, and does not change resourceVersion/ETag; Qualifying is a lifecycle-service-only in-flight reservation and is never a projected resource status (ADH-2026-058 clauses 1,7; F16-AD-02.1,15,15.2)"
    retention: standard
    fieldOwnership:
      spec.cloudProviderParticipationRef: {introducedBy: FEATURE-0016, activatedBy: FEATURE-0016}
      spec.infrastructureStackRef: {introducedBy: FEATURE-0016, activatedBy: FEATURE-0016}
      spec.targetClass: {introducedBy: FEATURE-0016, activatedBy: FEATURE-0016}
      status.lifecycle: {introducedBy: FEATURE-0016, activatedBy: FEATURE-0016}
      status.qualification: {introducedBy: FEATURE-0016, activatedBy: FEATURE-0016}
      status.maintenanceEpoch: {introducedBy: FEATURE-0016, activatedBy: FEATURE-0016}
      status.observedGeneration: {introducedBy: FEATURE-0016, activatedBy: FEATURE-0016}
      status.factSetRef: {introducedBy: FEATURE-0016, activatedBy: FEATURE-0016}
      status.qualificationResultRef: {introducedBy: FEATURE-0016, activatedBy: FEATURE-0016}
    requestContract:
      clientRequired: ["metadata.name", "spec.cloudProviderParticipationRef.uid", "spec.infrastructureStackRef.uid", "spec.targetClass=synthetic-iaas"]
      clientOptional: []
      forbidden: ["metadata.scopeRef", "adapterAuthorityRef", "SecretRef extension", "any status field", "metadata.uid", "metadata.generation", "metadata.resourceVersion", "unknown field"]
      serverAssigned: ["metadata.uid", "metadata.generation", "metadata.resourceVersion", "status.lifecycle=Active", "status.qualification=Unqualified", "status.maintenanceEpoch=0", "status.observedGeneration=referenced InfrastructureStack metadata.generation"]
      createSuccessStatus: 201
      actionSuccessStatus: 200
      scopeDerivation: "immutable CloudProvider scope derived solely from the resolved spec.cloudProviderParticipationRef; no client-supplied or separately persisted scopeRef (ADH-2026-058 clause 1/F16-AD-02.1)"
      idempotencyApplicability: "create, qualify, and retire only; GET/LIST never require, inspect, reserve, wait on, or replay an idempotency record (ADH-2026-058 clause 5/F16-AD-08.5)"
