  - {id: VS0-SCHEMA-010, identity: "governance.sovrunn.io/v1alpha1/CloudProviderParticipation", owner: FEATURE-0015, profile: ManagedResource, boundary: operator-facing, scopes: [CloudPlatform], required: ["metadata.name:string(1..253)", "spec.cloudPlatformRef:TypedRef<CloudPlatform>(uid-pinned)", "spec.cloudProviderRef:TypedRef<CloudProvider>(uid-pinned)", "spec.environment:enum[development]", "status.phase:enum[Pending,Active,Suspended,Terminating,Terminated]"], optional: ["spec.providerSelectionModes:enum[CustomerSelected,PlatformAssigned][]", "spec.permittedHostingLocationRefs:TypedRef<HostingLocation>[]", "status.conditions:Condition[]"], refs: {spec.cloudPlatformRef: [CloudPlatform], spec.cloudProviderRef: [CloudProvider], spec.permittedHostingLocationRefs: [HostingLocation]}, classification: Provider-confidential, redaction: "protected agreement data omitted", mutability: "platform/provider delegated spec portions; participation-controller status", retention: retained-summary, fieldOwnership: {spec.providerSelectionModes: {introducedBy: FEATURE-0021, activatedBy: FEATURE-0021}}}
