    retention: retained-summary
    fieldOwnership: {spec.providerSelectionModes: {introducedBy: FEATURE-0021, activatedBy: FEATURE-0021}, spec.permittedHostingLocationRefs: {introducedBy: FEATURE-0021, activatedBy: FEATURE-0021}}
    requestContract: {clientRequired: ["metadata.name", "spec.cloudPlatformRef", "spec.cloudProviderRef", "spec.environment(development only)"], clientOptional: [], forbidden: ["spec.providerSelectionModes (FEATURE-0021-introduced and FEATURE-0021-activated; deferred-to-owner-feature, rejected by FEATURE-0015)", "spec.permittedHostingLocationRefs (FEATURE-0021-introduced and FEATURE-0021-activated; deferred-to-owner-feature, rejected by FEATURE-0015)"], serverAssigned: ["metadata.scopeRef (derived from resolved spec.cloudPlatformRef)", "status.phase=Pending", "status.platformSuspended=false", "status.providerSuspended=false", "status.requestExpiresAt=createdAt+7 days", "metadata.uid", "metadata.generation", "metadata.resourceVersion", "metadata.createdAt", "metadata.updatedAt"], rejects: ["metadata.uid", "metadata.generation", "metadata.resourceVersion", "metadata.createdAt", "metadata.updatedAt", "metadata.scopeRef", "any status field", "field owned by another feature", "unknown field"], createSuccessStatus: 201, createHeaders: "Idempotency-Key only; If-Match rejected/not accepted (ADH-2026-046 decision 2)", itemActionBody: "empty JSON body; requires If-Match and Idempotency-Key", scopeDerivation: "immutable CloudPlatform scopeRef derived from resolved spec.cloudPlatformRef; referenced CloudPlatform must exist and its UID must equal the resulting metadata.scopeRef.uid (ADH-2026-047 decision 2)"}
