  - {id: VS0-SCHEMA-002, identity: "F12:TypedRef", owner: FEATURE-0012, profile: EmbeddedValue, boundary: shared, scopes: "$metadata.scopeKinds", externalRef: api/schemas/_common/typed-ref.json, slice0Constraint: "domain fields constrain allowed kind and scope; provider-native IDs prohibited"}
  - {id: VS0-SCHEMA-003, identity: "F12:Condition", owner: FEATURE-0012, profile: EmbeddedValue, boundary: shared, scopes: [], externalRef: api/schemas/_common/condition.json, slice0Constraint: "one registered producer per condition type"}
  - {id: VS0-SCHEMA-004, identity: "F12:Problem", owner: FEATURE-0012, profile: TransientRequestResult, boundary: customer-facing, scopes: [], externalRef: api/schemas/_common/problem.json, slice0Constraint: "RFC9457 plus code/requestId/violations; problemCodes below are closed"}
  - {id: VS0-SCHEMA-005, identity: "governance.sovrunn.io/v1alpha1/DecisionProfile", owner: FEATURE-0013, profile: VersionedDefinition, boundary: governance-only, scopes: [Platform], externalRef: api/schemas/decision-profile.json, slice0Constraint: "only registered sovereignty and placement profiles; exact versions pinned"}
  - {id: VS0-SCHEMA-006, identity: "governance.sovrunn.io/v1alpha1/DecisionRecord", owner: FEATURE-0013, profile: ImmutableRecord, boundary: governance-only, scopes: [Project, CloudPlatform, CloudProvider], externalRef: api/schemas/decision-record.json, slice0Constraint: "AUTHORITATIVE FINAL records only; metadata.scopeRef sole scope; inputs/profile/result/audit refs pinned"}
