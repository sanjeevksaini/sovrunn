metadata:
  id: VS-000-CONTRACT-1
  version: 0.1.0
  status: Experimental
  scope: Slice0Only
  baseline: ARCH-2026.08-PHASE2R-CANONICAL
  controllingHandoff: ADH-2026-042
  semanticAuthorities:
    - docs/architecture/canonical/sovrunn-finalized-data-model.md
    - docs/architecture/canonical/sovrunn-final-canonical-contract-catalog.md
    - docs/architecture/vertical-slices/VS-000-core-skeleton.md
  proseSpec: docs/architecture/vertical-slices/VS-000-contract-specification.md
  traceability: docs/traceability/VS-000_CONTRACT_TRACEABILITY_MATRIX.md
  scopeKinds: [Platform, Organization, OrganizationUnit, Tenant, Project, CloudPlatform, CloudProvider]
  milestonesAreStates: false

schemaDefaults:
  metadata: "FEATURE-0012 ObjectMeta; name 1..253; uid/resourceVersion/timestamps/generation system-owned; exactly one canonical scopeRef except Platform"
  typedRef: "FEATURE-0012 TypedRef; apiVersion/kind/name required; uid required after resolution; name+uid must resolve to one object"
  managedResource: "metadata/spec/status; spec desired state; status system-owned; unknown and duplicate fields rejected"
  versionedDefinition: "draft mutable; published version immutable; changed contract creates a new version"
  immutableRecord: "FINAL on persistence; append-only; correction/supersession/revocation creates a linked record"
  limits: {string: 253, idempotencyKey: 128, reasonCode: 63, refs: 64, conditions: 32, violations: 32}
  classification: Tenant-confidential
  redaction: "customer projections omit Internal, Provider-confidential, Secret and protected-handle values"

schemas:
  - {id: VS0-SCHEMA-001, identity: "F12:ObjectMeta", owner: FEATURE-0012, profile: EmbeddedValue, boundary: shared, scopes: "$metadata.scopeKinds", externalRef: api/schemas/_common/object-meta.json, slice0Constraint: "seven ScopeKinds; CloudPlatform and CloudProvider added only through the approved canonical bootstrap (DEC-0059)"}
  - {id: VS0-SCHEMA-002, identity: "F12:TypedRef", owner: FEATURE-0012, profile: EmbeddedValue, boundary: shared, scopes: "$metadata.scopeKinds", externalRef: api/schemas/_common/typed-ref.json, slice0Constraint: "domain fields constrain allowed kind and scope; provider-native IDs prohibited"}
  - {id: VS0-SCHEMA-003, identity: "F12:Condition", owner: FEATURE-0012, profile: EmbeddedValue, boundary: shared, scopes: [], externalRef: api/schemas/_common/condition.json, slice0Constraint: "one registered producer per condition type"}
  - {id: VS0-SCHEMA-004, identity: "F12:Problem", owner: FEATURE-0012, profile: TransientRequestResult, boundary: customer-facing, scopes: [], externalRef: api/schemas/_common/problem.json, slice0Constraint: "RFC9457 plus code/requestId/violations; problemCodes below are closed"}
  - {id: VS0-SCHEMA-005, identity: "governance.sovrunn.io/v1alpha1/DecisionProfile", owner: FEATURE-0013, profile: VersionedDefinition, boundary: governance-only, scopes: [Platform], externalRef: api/schemas/decision-profile.json, slice0Constraint: "only registered sovereignty and placement profiles; exact versions pinned"}
  - {id: VS0-SCHEMA-006, identity: "governance.sovrunn.io/v1alpha1/DecisionRecord", owner: FEATURE-0013, profile: ImmutableRecord, boundary: governance-only, scopes: [Project, CloudPlatform, CloudProvider], externalRef: api/schemas/decision-record.json, slice0Constraint: "AUTHORITATIVE FINAL records only; metadata.scopeRef sole scope; inputs/profile/result/audit refs pinned"}
  - {id: VS0-SCHEMA-007, identity: "audit.sovrunn.io/v1alpha1/AuditEvent", owner: FEATURE-0013, profile: ImmutableRecord, boundary: governance-only, scopes: "$metadata.scopeKinds", externalRef: api/schemas/audit-event.json, slice0Constraint: "decision, operation, binding and privileged-action events; safe audience projections only"}
